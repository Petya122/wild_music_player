name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    # The signing key lives in the "release" environment's secrets; every release waits for approval
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew :shared:testAndroid testFullDebugUnitTest testPlayDebugUnitTest -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon

      - name: Build Release APK (full version, for GitHub)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Without the signing key, stop: an APK signed with another key can't update the app on phones
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The release signing key (KEYSTORE_BASE64 / KEYSTORE_PASSWORD) is missing from the release environment."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > wild_music_player.jks
          echo "storeFile=../wild_music_player.jks" > keystore.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
          echo "keyAlias=wildmusic" >> keystore.properties
          echo "keyPassword=$KEYSTORE_PASSWORD" >> keystore.properties
          ./gradlew assembleFullRelease -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
          cp app/build/outputs/apk/full/release/*.apk wild_music_player-${{ github.ref_name }}.apk

      # The Google Play version: an app bundle signed with the Play upload key. Not attached to the
      # GitHub release (the in-app updater must never see it); download it from this run's artifacts and
      # upload it in Play Console. Skipped until the upload key is in the release environment.
      - name: Build Play Bundle (play version, for Google Play)
        id: play
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "::notice::No Play upload key (UPLOAD_KEYSTORE_BASE64 / UPLOAD_KEYSTORE_PASSWORD) yet: skipping the Play bundle."
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > upload.jks
          echo "storeFile=../upload.jks" > upload.properties
          echo "storePassword=$UPLOAD_KEYSTORE_PASSWORD" >> upload.properties
          echo "keyAlias=upload" >> upload.properties
          echo "keyPassword=$UPLOAD_KEYSTORE_PASSWORD" >> upload.properties
          ./gradlew bundlePlayRelease -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
          cp app/build/outputs/bundle/playRelease/*.aab wild_music_player-play-${{ github.ref_name }}.aab
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Keep Play Bundle as Run Artifact
        if: steps.play.outputs.built == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-bundle-${{ github.ref_name }}
          path: wild_music_player-play-${{ github.ref_name }}.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Release ${{ github.ref_name }}
          files: wild_music_player-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true

