name: Build & Release APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  # The shared code must also compile and pass its tests on iOS (needs a Mac, so it runs here)
  ios-tests:
    name: Shared Code Tests on iOS
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Run Shared Tests on the iOS Simulator
        run: |
          set -o pipefail
          ./gradlew :shared:iosSimulatorArm64Test -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon 2>&1 | tee gradle-ios.log

      # The iPhone app (iosApp/): an Xcode project generated from project.yml, wrapping the shared code
      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build iOS App for the Simulator
        run: |
          set -o pipefail
          xcodebuild -project iosApp/WildMusicPlayer.xcodeproj -scheme WildMusicPlayer -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcode-ios.log

      - name: Build Unsigned iPhone App (IPA)
        run: |
          set -o pipefail
          xcodebuild -project iosApp/WildMusicPlayer.xcodeproj -scheme WildMusicPlayer -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee -a xcode-ios.log
          # An IPA is the .app inside a Payload folder, zipped. Sideloading tools sign it for your iPhone.
          mkdir -p Payload
          cp -R build/ios/Build/Products/Release-iphoneos/WildMusicPlayer.app Payload/
          zip -qr WildMusicPlayer-unsigned.ipa Payload
          cd build/ios/Build/Products/Debug-iphonesimulator && zip -qr ../../../../../WildMusicPlayer-simulator.zip WildMusicPlayer.app

      - name: Upload iOS Builds
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: |
            WildMusicPlayer-unsigned.ipa
            WildMusicPlayer-simulator.zip

      # Logs need a GitHub login to read; annotations are public, so failures are repeated there
      - name: Report Failures as Annotations
        if: failure()
        run: |
          { grep -E "^e: " gradle-ios.log xcode-ios.log; grep -E "error:|What went wrong|FAILED|Exception" gradle-ios.log xcode-ios.log; } 2>/dev/null | head -n 25 | while IFS= read -r line; do
            echo "::error::$line"
          done
          for f in shared/build/test-results/iosSimulatorArm64Test/*.xml; do
            [ -f "$f" ] && grep -A2 "<failure" "$f" | head -n 6 | tr '\n' ' ' | sed 's/^/::error::/' && echo
          done
          true

  build:
    name: Build & Publish Release APK
    # Pushes to master only run the tests; tags also build and publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ios-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew :shared:testAndroid testDebugUnitTest -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Release keystore secret detected. Decoding keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > wild_music_player.jks
            echo "storeFile=../wild_music_player.jks" > keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=wildmusic" >> keystore.properties
            echo "keyPassword=$KEYSTORE_PASSWORD" >> keystore.properties
            ./gradlew assembleRelease -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
            cp app/build/outputs/apk/release/*.apk wild_music_player-${{ github.ref_name }}.apk
          else
            echo "No keystore secret provided. Building debug APK..."
            ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
            cp app/build/outputs/apk/debug/*.apk wild_music_player-${{ github.ref_name }}.apk
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: wild_music_player-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true

