name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    # The signing key lives in the "release" environment's secrets; every release waits for approval
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew :shared:testAndroid testDebugUnitTest -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Without the signing key, stop: an APK signed with another key can't update the app on phones
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The release signing key (KEYSTORE_BASE64 / KEYSTORE_PASSWORD) is missing from the release environment."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > wild_music_player.jks
          echo "storeFile=../wild_music_player.jks" > keystore.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
          echo "keyAlias=wildmusic" >> keystore.properties
          echo "keyPassword=$KEYSTORE_PASSWORD" >> keystore.properties
          ./gradlew assembleRelease -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
          cp app/build/outputs/apk/release/*.apk wild_music_player-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Release ${{ github.ref_name }}
          files: wild_music_player-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true

