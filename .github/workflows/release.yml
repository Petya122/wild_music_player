name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > wild_music_player.jks
            cat <<EOF > keystore.properties
            storeFile=../wild_music_player.jks
            storePassword=$KEYSTORE_PASSWORD
            keyAlias=wildmusic
            keyPassword=$KEYSTORE_PASSWORD
            EOF
          fi

      - name: Build APK
        run: |
          if [ -f "wild_music_player.jks" ]; then
            ./gradlew assembleRelease -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
            cp app/build/outputs/apk/release/*.apk wild_music_player-${{ github.ref_name }}.apk
          else
            ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
            cp app/build/outputs/apk/debug/*.apk wild_music_player-${{ github.ref_name }}.apk
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: wild_music_player-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true

